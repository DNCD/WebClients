name: iOS Mail

on:
  push:
    paths:
      - "ios-mail/**"
      - ".github/workflows/ios-mail.yml"
  pull_request:
    paths:
      - "ios-mail/**"
      - ".github/workflows/ios-mail.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios-mail
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project MailClient.xcodeproj -scheme MailClient

      - name: Build and test
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone")))')
          echo "Using simulator $DEVICE_ID"
          xcodebuild test \
            -project MailClient.xcodeproj \
            -scheme MailClient \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || {
              grep -E "error:|\*\* (BUILD|TEST) FAILED|Test Case .* failed|XCTAssert" build.log | head -100
              tail -40 build.log
              exit 1
            }
          grep -E "Test Case .* (passed|failed)|Executed [0-9]+ test" build.log | tail -40

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-mail-build-log
          path: ios-mail/build.log
          if-no-files-found: ignore
