name: MailClient
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Sent to the API as `x-pm-appversion`. Proton identifies clients by this value and may
    # reject ones it does not recognise; replace it with the identifier issued for your app.
    PM_APP_VERSION: "ios-mailclient@0.1.0"

packages:
  ProtonCore:
    url: https://github.com/ProtonMail/protoncore_ios
    exactVersion: 37.6.1

targets:
  MailClient:
    type: application
    platform: iOS
    sources:
      - MailClient
    dependencies:
      - package: ProtonCore
        product: ProtonCoreCryptoGoInterface
      - package: ProtonCore
        product: ProtonCoreCryptoGoImplementation
    info:
      path: MailClient/Info.plist
      properties:
        CFBundleDisplayName: Mail
        PMAppVersion: $(PM_APP_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mailclient
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  MailClientTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MailClientTests
    dependencies:
      - target: MailClient
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MailClient:
    build:
      targets:
        MailClient: all
        MailClientTests: [test]
    test:
      targets:
        - MailClientTests
